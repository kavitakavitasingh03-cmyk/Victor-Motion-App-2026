name: Build Debug APK & GitHub Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java 17 or higher
        shell: bash
        run: |
          JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version: $JAVA_VERSION"
          JAVA_MAJOR=$(echo "$JAVA_VERSION" | cut -d'.' -f1)
          if [ -z "$JAVA_MAJOR" ] || [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Java 17 or higher is required, detected: $JAVA_VERSION"
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore if missing
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
            echo "Temporary debug.keystore created."
          else
            echo "Using existing debug.keystore."
          fi

      - name: Build Debug APK
        id: build_apk
        shell: bash
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::Verified non-empty Debug APK was not found at $APK_PATH"
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Upload Debug APK Artifact
        id: upload_apk
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        id: github_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES="Automatically generated debug APK build for testing purposes only. Not a Play Store production release."
          RAW_OUTPUT=$(gh release create "$RELEASE_TAG" \
            "app/build/outputs/apk/debug/app-debug.apk" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest)
          RELEASE_URL=$(printf '%s\n' "$RAW_OUTPUT" | tail -n 1 | tr -d '\r')
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"

      - name: Report Build and Release Status
        if: always()
        shell: bash
        run: |
          {
            echo "## Victor Motion — Debug APK Build Report"
            echo ""
            if [ "${{ steps.build_apk.outcome }}" = "success" ] && [ "${{ steps.upload_apk.outcome }}" = "success" ]; then
              echo "- **Debug APK Build:** Succeeded (\`app/build/outputs/apk/debug/app-debug.apk\`)"
              echo "- **Actions Artifact:** \`app-debug-apk\` uploaded and preserved"
            else
              echo "- **Debug APK Build / Artifact Upload:** Failed"
            fi

            if [ "${{ steps.github_release.outcome }}" = "success" ]; then
              echo "- **GitHub Release:** Published"
              echo "- **Release URL:** ${{ steps.github_release.outputs.release_url }}"
              echo "- **APK Download:** Download \`app-debug.apk\` directly from the GitHub Release above or from the \`app-debug-apk\` workflow artifact."
            elif [ "${{ steps.github_release.outcome }}" = "failure" ]; then
              echo "- **GitHub Release:** Failed (the \`app-debug-apk\` workflow artifact has been preserved)"
              echo "- **APK Download:** Download \`app-debug-apk\` from the workflow run's Artifacts section."
            else
              echo "- **GitHub Release:** Skipped"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.github_release.outcome }}" = "success" ]; then
            echo "GitHub Release published successfully: ${{ steps.github_release.outputs.release_url }}"
          elif [ "${{ steps.github_release.outcome }}" = "failure" ]; then
            echo "GitHub Release publishing failed, but the 'app-debug-apk' Actions artifact was preserved."
          else
            echo "GitHub Release publishing did not run."
          fi
